name: CI

on:
  pull_request:
    branches:
      - dev
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Instalar dependências do backend
        run: mvn dependency:resolve -f backend/pom.xml

      - name: Verificar build do backend
        run: mvn compile -f backend/pom.xml

      - name: Executar testes automatizados
        run: mvn test -f backend/pom.xml

      - name: Validar arquivos YAML do repositório
        run: |
          pip install yamllint
          yamllint .github/workflows/

      - name: Verificar existência de arquivos obrigatórios
        run: |
          test -f README.md \
             || (echo "README.md nao encontrado" && exit 1)
           test -f docs/riscos.md \
             || (echo "docs/riscos.md nao encontrado" && exit 1)
           test -f .github/PULL_REQUEST_TEMPLATE.md \
             || (echo "PR template nao encontrado" && exit 1)
           test -d .github/workflows \
             || (echo "workflows nao encontrado" && exit 1)
           echo "Todos os arquivos obrigatorios encontrados."

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependências do frontend
        run: npm install
        working-directory: frontend

      - name: Executar lint do frontend
        run: npm run lint
        working-directory: frontend

      - name: Verificar build do frontend
        run: npm run build
        working-directory: frontend

      - name: Executar testes do frontend
        run: npm test
        working-directory: frontend
