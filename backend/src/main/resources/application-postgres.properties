# PostgreSQL é o banco padrão para execução da aplicação.
# Em produção, prefira informar SPRING_DATASOURCE_* pelas variáveis do serviço.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:doacao}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:doacao}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:doacao}}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
